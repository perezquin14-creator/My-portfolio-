<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In Form</title><style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background: #E8EAF6;
        color: #283593;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    section{
        width: 350px;
        padding: 35px;
        border-radius: 15px;
        background: white;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    }

    .logo{
        display: block;
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 50%;
        margin: 0 auto 15px;
    }

    h2{
        text-align: center;
        margin-bottom: 30px;
        font-size: 28px;
        color: #3949AB;
    }

    label{
        display: block;
        font-weight: bold;
        font-size: 15px;
        margin-bottom: 6px;
        color: #283593;
    }

    input[type="email"],
    input[type="text"],
    input[type="password"]{
        width: 100%;
        padding: 11px;
        margin-bottom: 18px;
        font-size: 15px;
        border: 1px solid #9FA8DA;
        border-radius: 6px;
        outline: none;
    }

    input[type="email"]:focus,
    input[type="text"]:focus,
    input[type="password"]:focus{
        border: 2px solid #3949AB;
    }

    input[type="submit"]{
        width: 100%;
        padding: 12px;
        font-size: 16px;
        font-weight: bold;
        background: #3949AB;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 5px;
    }

    input[type="submit"]:hover{
        background: #5C6BC0;
    }
</style>

</head><body><section>

    <!-- LOGO -->
    <img 
        src="/storage/emulated/0/DCIM/Camera/IMG_20260713_171309.jpg"
        alt="Logo"
        class="logo"
    >

    <h2>LOG IN</h2>

    <form>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email">

        <label for="username">Username:</label>
        <input type="text" id="username" name="username">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">

        <input type="submit" value="Log in">

    </form>

</section>

</body>
</html>
